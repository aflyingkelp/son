<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#141713"><title>VERITY — Discovery Center</title><link rel="stylesheet" href="style.css"></head>
<body><main id="game" aria-label="Verity first-person horror game"><div id="scene"></div><div id="wake" hidden aria-hidden="true"><div class="lid top"></div><div class="lid bottom"></div></div><div id="grain" aria-hidden="true"></div><div id="crosshair" hidden aria-hidden="true">+</div><div id="objective" hidden></div><div id="subtitle" role="status" aria-live="polite" hidden><span>VERITY</span><p></p></div><div id="prompt" hidden></div><div id="controls" hidden>W A S D — MOVE &nbsp; SHIFT — RUN &nbsp; E — INTERACT &nbsp; ESC — PAUSE</div>
<section id="menu"><div class="edition">DISCOVERY CENTER / OPENING</div><h1>VERITY</h1><p class="tagline">Someone will show you the way.</p><button id="begin">BEGIN</button><p class="instructions">Headphones recommended.<br>WASD to move. Mouse to look. E to interact.</p><div id="load-error" role="alert" hidden></div></section>
<section id="pause" hidden><h2>PAUSED</h2><button id="resume">RESUME</button><button id="restart">RESTART</button><button id="sound-toggle">MUSIC: ON [M]</button></section>
<section id="maze" hidden aria-label="Tabletop marble maze"><div class="maze-heading"><h2>MARBLE MAZE</h2><button id="close-maze">CLOSE [E]</button></div><canvas id="maze-canvas" width="490" height="490" aria-label="Use arrow keys or buttons to move the marble to the green corner"></canvas><p id="maze-text" aria-live="polite">Find the green corner.</p><div class="maze-buttons"><button data-step="0,-1">↑</button><button data-step="-1,0">←</button><button data-step="0,1">↓</button><button data-step="1,0">→</button><button id="reset-maze">RESET</button></div></section>
<div id="touch" hidden><div><button data-key="KeyW">↑</button><div><button data-key="KeyA">←</button><button data-key="KeyS">↓</button><button data-key="KeyD">→</button></div></div><button id="touch-use">USE</button></div></main><script src="three.min.js"></script><script src="world.js"></script><script src="encounter-music.js"></script><script src="verity-motion.js"></script><script src="game.js"></script></body></html>
